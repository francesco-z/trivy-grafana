# Optional: deploy this chart with Rancher Fleet (fleet/gitrepo.yaml). Ignored by helm (.helmignore).
defaultNamespace: monitoring
helm:
  # same release name as before the umbrella chart: resource names stay kube-prometheus-stack-*
  releaseName: kube-prometheus-stack
  # site values (values-site.yaml, not in git) from the ConfigMap trivy-grafana-site, see README
  valuesFrom:
    - configMapKeyRef:
        name: trivy-grafana-site
        namespace: monitoring
        key: values.yaml
