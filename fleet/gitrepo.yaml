apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  annotations:
    field.cattle.io/description: trivy-grafana, everyday CVE console (Prometheus + Grafana for trivy-operator metrics)
  name: trivy-grafana
  namespace: fleet-local
spec:
  branch: main
  # repo and clientSecretName from values-site.yaml (fleetGitRepo), set at apply time (see README)
  clientSecretName: <fleet-git-auth-secret>
  correctDrift: {}
  # one bundle: the chart, with chart/fleet.yaml
  paths:
    - chart
  pollingInterval: 1m0s
  repo: <git-repo-url>
  targets:
    - clusterSelector:
        matchExpressions:
          - key: provider.cattle.io
            operator: NotIn
            values:
              - harvester
