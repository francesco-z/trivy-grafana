apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
# picked up by the Grafana dashboard sidecar, folder from the grafana_folder annotation
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Trivy
configMapGenerator:
  - name: grafana-dashboard-trivy-overview
    files:
      - trivy-overview.json
  - name: grafana-dashboard-trivy-vulnerabilities
    files:
      - trivy-vulnerabilities.json
  - name: grafana-dashboard-trivy-checks
    files:
      - trivy-checks.json
  - name: grafana-dashboard-trivy-operator-vulnerabilities-16337
    files:
      - trivy-operator-vulnerabilities-16337.json
