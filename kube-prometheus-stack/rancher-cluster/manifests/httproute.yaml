apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  hostnames:
    - grafana.example.org
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: application
      namespace: gateway-system
      sectionName: http-example
  rules:
    - backendRefs:
        - kind: Service
          name: kube-prometheus-stack-grafana
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
