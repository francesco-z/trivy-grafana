---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "prometheus-egress"
  namespace: "monitoring"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  egress:
    # downstream kube-apiservers, trivy-operator scraped through the service proxy
    - toFQDNs:
        - matchName: "cluster-a-cluster-api.example.org"
        - matchName: "cluster-b-cluster-api.example.org"
        - matchName: "cluster-c-cluster-api.example.org"
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "grafana-egress"
  namespace: "monitoring"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  egress:
    # init container downloads the gnetId dashboards
    - toFQDNs:
        - matchName: "grafana.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
