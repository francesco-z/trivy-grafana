apiVersion: v1
data:
  admin-user: <GRAFANA_ADMIN_USER_BASE64>
  admin-password: <GRAFANA_ADMIN_PASSWORD_BASE64>
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
---
# one per downstream cluster: token and ca.crt of kube-system/metrics-reader-token on that cluster
apiVersion: v1
data:
  token: <TRIVY_METRICS_TOKEN_BASE64>
  ca.crt: <DOWNSTREAM_CLUSTER_CA_BASE64>
kind: Secret
metadata:
  name: trivy-metrics-cluster-a
  namespace: monitoring
type: Opaque
---
apiVersion: v1
data:
  token: <TRIVY_METRICS_TOKEN_BASE64>
  ca.crt: <DOWNSTREAM_CLUSTER_CA_BASE64>
kind: Secret
metadata:
  name: trivy-metrics-cluster-b
  namespace: monitoring
type: Opaque
---
apiVersion: v1
data:
  token: <TRIVY_METRICS_TOKEN_BASE64>
  ca.crt: <DOWNSTREAM_CLUSTER_CA_BASE64>
kind: Secret
metadata:
  name: trivy-metrics-cluster-c
  namespace: monitoring
type: Opaque
