apiVersion: v1
data:
  admin-user: <GRAFANA_ADMIN_USER_BASE64>
  admin-password: <GRAFANA_ADMIN_PASSWORD_BASE64>
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
---
# two keys per cluster in global.observability.clusters: token and ca.crt of the monitoring ServiceAccount token on that cluster
apiVersion: v1
data:
  <cluster>-token: <TRIVY_METRICS_TOKEN_BASE64>
  <cluster>-ca.crt: <DOWNSTREAM_CLUSTER_CA_BASE64>
kind: Secret
metadata:
  name: trivy-metrics
  namespace: monitoring
type: Opaque
